description: "Georgia Tech"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Theme and Colors
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"
header_background: "#003057"      # GT Navy
header_text_color: "#F7E9A7"      # Old Gold
accent_color: "#F7E9A7"
link_color: "#F7E9A7"
link_hover_color: "#DAA520"  

# Layout

show_excerpts: false        # show article excerpts on the home page
show_frame: true           # adds a gray frame to the site
show_sidebar: false        # show a sidebar instead of the usual header
minimal: false             # use a dark header

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {file: "index.html", title: "Home"}
  - {file: "TerryMooreResume", title: "CV"}
  - {file: "projects.html", title: "Projects"}
  - {file: "coursework.html", title: "Coursework"}
  

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Mail, icon: envelope, url: "mailto:terry.l.moore@gatech.edu"}
  - {title: Github, icon: github, url: "https://github.com/TerryMooreV"}
  - {title: Subscribe, icon: rss, url: "/feed.xml"}

